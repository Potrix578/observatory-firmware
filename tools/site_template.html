<style>
/* Layout: a component datasheet, one sheet per router, with a chip outline as the signature. */
:root {
  --paper: #F5F8FB; --panel: #FFFFFF; --ink: #12233A; --ink-2: #4A5B70; --rule: #D3DDE8;
  --mask: #173F86; --mask-ink: #F2F6FC; --mask-2: #B9CCEB; --pin: #B48A2C; --accent: #1B4FA8;
  --c-outside: #2a78d6; --c-fixed: #1baf7a; --c-review: #eda100; --c-open: #e34948;
  --bad: #B42318; --bad-bg: #FDECEA; --warn: #7D5300; --warn-bg: #FCF2DC;
  --good: #0E6E4D; --good-bg: #E3F4EC; --quiet: #4A5B70; --quiet-bg: #E9EEF4;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1B2B; --panel: #16253A; --ink: #E8EEF5; --ink-2: #A3B3C6; --rule: #2B3D55;
  --mask: #122F63; --mask-ink: #EAF1FB; --mask-2: #A9C0E6; --pin: #C9A24A; --accent: #8DB4F2;
  --c-outside: #256abf; --c-fixed: #199e70; --c-review: #c98500; --c-open: #e34948;
  --bad: #FFB4A9; --bad-bg: #4A1F1C; --warn: #F2CC7A; --warn-bg: #43330F;
  --good: #8EDFBD; --good-bg: #123D2E; --quiet: #B6C3D3; --quiet-bg: #233449;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0F1B2B; --panel: #16253A; --ink: #E8EEF5; --ink-2: #A3B3C6; --rule: #2B3D55;
  --mask: #122F63; --mask-ink: #EAF1FB; --mask-2: #A9C0E6; --pin: #C9A24A; --accent: #8DB4F2;
  --c-outside: #256abf; --c-fixed: #199e70; --c-review: #c98500; --c-open: #e34948;
  --bad: #FFB4A9; --bad-bg: #4A1F1C; --warn: #F2CC7A; --warn-bg: #43330F;
  --good: #8EDFBD; --good-bg: #123D2E; --quiet: #B6C3D3; --quiet-bg: #233449;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--body); margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.masthead { background: var(--mask); color: var(--mask-ink); border-bottom: 5px dotted var(--pin); }
.masthead .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-block: 14px; }
.wordmark { display: inline-flex; align-items: center; gap: 9px; color: inherit; font: 600 1.45rem/1 var(--display); letter-spacing: .04em; text-transform: uppercase; text-decoration: none; }
.wordmark::before { content: ""; width: 12px; height: 16px; border: 2px solid var(--pin); box-shadow: -4px 0 0 -2px var(--pin), 4px 0 0 -2px var(--pin); }
.nav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.nav a { color: var(--mask-2); font: 500 .8rem/1.6 var(--mono); text-decoration: none; padding-block: 4px; border-bottom: 2px solid transparent; }
.nav a[aria-current="page"], .nav a:hover { color: var(--mask-ink); border-bottom-color: var(--pin); }

main { padding-block: 28px 56px; display: grid; gap: 40px; }
main > * { min-width: 0; }
section { display: grid; gap: 16px; min-width: 0; }
section > * { min-width: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.08; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); max-width: 20ch; }
h2 { font-size: 1.75rem; letter-spacing: .01em; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
h3 { font-size: 1.25rem; }
p { margin: 0; max-width: 68ch; }
.lead { font-size: 1.12rem; color: var(--ink-2); }
.note { color: var(--ink-2); font-size: .93rem; }
.intro { display: grid; gap: 14px; }

.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 28px; }
.chip { position: relative; display: grid; gap: 10px; align-content: start; margin-inline: 12px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--rule); color: inherit; text-decoration: none; }
.chip::before, .chip::after { content: ""; position: absolute; top: 14px; bottom: 14px; width: 11px; background: repeating-linear-gradient(to bottom, var(--pin) 0 8px, transparent 8px 18px); }
.chip::before { left: -12px; } .chip::after { right: -12px; }
.chip:hover { border-color: var(--accent); }
.chip h3 { font-size: 1.5rem; }
.ref { font: 400 .78rem/1.45 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.big { font: 600 2.9rem/1 var(--display); font-variant-numeric: tabular-nums; }
.big span { color: var(--ink-2); font-weight: 500; }
.chip .note { font-size: .88rem; }

.table-box { overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); }
.table-box.tall { max-height: 34rem; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
th { text-align: left; font: 600 .74rem/1.3 var(--mono); color: var(--ink-2); letter-spacing: .02em; background: var(--panel); position: sticky; top: 0; z-index: 1; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.id { font-family: var(--mono); font-size: .84rem; white-space: nowrap; }
td.mono { font-family: var(--mono); font-size: .84rem; overflow-wrap: anywhere; }
td.wide { min-width: 22rem; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; font-size: .78rem; font-weight: 600; white-space: nowrap; background: var(--quiet-bg); color: var(--quiet); }
.pill::before { content: "–"; font-family: var(--mono); }
.pill.likely { background: var(--bad-bg); color: var(--bad); } .pill.likely::before { content: "▲"; font-size: .62rem; }
.pill.confirm, .pill.review { background: var(--warn-bg); color: var(--warn); } .pill.confirm::before, .pill.review::before { content: "?"; }
.pill.fixed { background: var(--good-bg); color: var(--good); } .pill.fixed::before { content: "✓"; }
.pill.left { background: var(--good-bg); color: var(--good); } .pill.left::before { content: "−"; }
.pill.entered { background: var(--bad-bg); color: var(--bad); } .pill.entered::before { content: "+"; }
.pill.stayed { background: var(--quiet-bg); color: var(--quiet); } .pill.stayed::before { content: "="; }

@media (max-width: 760px) {
  table.stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack td { border-bottom: 0; padding-block: 4px; min-width: 0; text-align: left; white-space: normal; }
  table.stack tr { padding-block: 8px; border-bottom: 1px solid var(--rule); }
  table.stack tr:last-child { border-bottom: 0; }
}
.report { display: inline-block; font-size: .78rem; color: var(--ink-2); }
.sheet-head { display: grid; gap: 12px; }
.spec { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
@media (max-width: 760px) { .spec { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.spec div { background: var(--panel); padding: 8px 12px; min-width: 0; }
.spec dt { font: 500 .72rem/1.3 var(--mono); color: var(--ink-2); }
.spec dd { margin: 2px 0 0; font: 500 .9rem/1.35 var(--mono); overflow-wrap: anywhere; }
dl { margin: 0; }

.verdict { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 40px; align-items: center; padding: 24px; background: var(--panel); border: 1px solid var(--rule); }
.verdict-text { display: grid; gap: 10px; min-width: 0; }
.verdict h2 { border: 0; padding: 0; font-size: clamp(2rem, 4.4vw, 2.9rem); }
.kicker { font: 500 .76rem/1.3 var(--mono); color: var(--ink-2); }
.verdict .note { grid-column: 1 / -1; padding-top: 12px; border-top: 1px solid var(--rule); max-width: none; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(5.4rem, 1fr)); gap: 8px; }
.tile { display: grid; gap: 4px; padding: 10px 12px; background: var(--quiet-bg); color: var(--quiet); }
.tile.good { background: var(--good-bg); color: var(--good); }
.tile.bad { background: var(--bad-bg); color: var(--bad); }
.tile dt { font-size: .78rem; font-weight: 600; }
.tile dd { margin: 0; font: 600 2.1rem/1 var(--display); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .verdict { grid-template-columns: minmax(0, 1fr); padding: 18px; } }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; background: var(--paper); border-bottom: 2px solid var(--rule); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; padding: 10px 12px; font: 600 1.08rem/1 var(--display); letter-spacing: .02em; color: var(--ink-2); background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pin); }
.panel { display: grid; gap: 36px; min-width: 0; }
.panel > * { min-width: 0; }
.sheet { display: grid; gap: 24px; min-width: 0; }
.sheet > * { min-width: 0; }

.issues { display: grid; gap: 10px; }
.issue { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 14px; padding: 14px; background: var(--panel); border: 1px solid var(--rule); }
.score { display: grid; align-content: center; justify-items: center; gap: 2px; padding: 8px 4px; background: var(--quiet-bg); color: var(--quiet); }
.score b { font: 600 1.6rem/1 var(--display); font-variant-numeric: tabular-nums; }
.score span { font-size: .68rem; font-weight: 600; }
.score.critical { background: var(--bad); color: var(--panel); }
.score.high { background: var(--bad-bg); color: var(--bad); }
.score.medium { background: var(--warn-bg); color: var(--warn); }
.issue-body { display: grid; gap: 5px; justify-items: start; min-width: 0; }
.issue-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.issue h4 { margin: 0; font: 500 .9rem/1.4 var(--mono); }
.more { padding: 0; background: none; border: 0; }
.more > summary { padding: 10px 12px; background: var(--panel); border: 1px solid var(--rule); font: 600 .92rem/1.3 var(--body); }
.more[open] > summary { margin-bottom: 10px; }
.why { padding: 0; background: none; border: 0; margin-top: 4px; }
.why > summary { font: 400 .82rem/1.4 var(--body); color: var(--accent); }
.why p { margin-top: 4px; font-size: .88rem; color: var(--ink-2); }
.jump { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--rule); }
.jump .big { font-size: 2.1rem; }
.link-button { font: 600 .9rem/1.3 var(--body); padding: 0; background: none; border: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px 48px; align-items: end; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: 2px 8px; font-size: .9rem; color: var(--ink-2); }
.steps li::before { content: counter(step); grid-row: span 2; font: 600 1.3rem/1.1 var(--display); color: var(--pin); }
.steps b { color: var(--ink); font-weight: 600; }
.chip-verdict { font: 600 1.15rem/1.2 var(--display); }
.chip-tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: .86rem; color: var(--ink-2); }
.chip-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip:hover .chip-open { text-decoration: underline; }
.chip-open { color: var(--accent); font-weight: 600; }
footer a { color: inherit; }
.foot-links { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-bottom: 8px; font-weight: 600; }

.answer { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 12px 32px; align-items: center; }
.answer .big { font-size: clamp(3.4rem, 11vw, 5.2rem); white-space: nowrap; }
@media (max-width: 640px) { .answer { grid-template-columns: minmax(0, 1fr); } }
.tally { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.tally span { font-size: .95rem; }
.tally b { font: 600 1.35rem/1 var(--display); font-variant-numeric: tabular-nums; margin-right: 4px; }

.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: 10px; align-items: center; }
.bar-label { font: 500 .82rem/1.2 var(--mono); }
.bar { display: flex; gap: 2px; height: 26px; min-width: 0; }
.seg { min-width: 2px; }
.seg:first-child { border-radius: 4px 0 0 4px; } .seg:last-child { border-radius: 0 4px 4px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .86rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
#tip { position: fixed; z-index: 20; pointer-events: none; padding: 6px 10px; background: var(--ink); color: var(--paper); font-size: .82rem; max-width: 240px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.controls button { font: 500 .84rem/1.2 var(--body); padding: 7px 11px; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); cursor: pointer; }
.controls button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.controls label { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; }
.controls input[type="search"] { font: 400 .9rem/1.2 var(--body); padding: 7px 10px; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); min-width: 0; width: 15rem; max-width: 100%; }

.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
.columns > * { min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 400 .82rem/1.5 var(--mono); color: var(--ink-2); padding: 0; margin: 0; list-style: none; }
details { background: var(--panel); border: 1px solid var(--rule); padding: 9px 12px; }
summary { cursor: pointer; font: 500 .84rem/1.4 var(--mono); }
pre { margin: 8px 0 0; font: 400 .78rem/1.5 var(--mono); overflow-x: auto; color: var(--ink-2); }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 72ch; }
footer { border-top: 1px solid var(--rule); padding-block: 18px 28px; color: var(--ink-2); font-size: .85rem; }
.glossary { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px 24px; margin: 0; }
.glossary div { display: grid; gap: 3px; justify-items: start; }
.glossary dd { margin: 0; font-size: .9rem; color: var(--ink-2); }
</style>
<!--HEAD-END-->
<header class="masthead"><div class="wrap">
  <a class="wordmark" href="#home">Firmware Observatory</a>
  <nav class="nav" id="nav" aria-label="Routers"></nav>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="tip" hidden></div>
<script>
const DATA = /*DATA*/null;
const app = document.getElementById("app");
const number = new Intl.NumberFormat("en-GB");
const decimal = new Intl.NumberFormat("en-GB", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const PILLS = { "Likely present": "likely", "To confirm": "confirm", "To review": "review", "Fixed": "fixed" };
const CHANGES = { left: "Gone", entered: "New", stayed: "Still open" };
const SEGMENTS = [["outside", "Outside this router, or removed by hand"], ["fixed", "Fixed"], ["review", "To review"], ["open", "Open"]];
const REPOSITORY = "https://github.com/Potrix578/observatory-firmware";

const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pill = (label) => `<span class="pill ${PILLS[label] || ""}">${esc(label)}</span>`;
const cveLink = (cve) => `<a href="https://nvd.nist.gov/vuln/detail/${esc(cve)}" target="_blank" rel="noopener">${esc(cve)}</a>`;
const score = (value) => (value == null ? "—" : decimal.format(value));
const megabytes = (bytes) => `${decimal.format(bytes / 1048576)} MB`;
const hex = (value) => `0x${value.toString(16).toUpperCase().padStart(6, "0")}`;
const deviceName = (id) => DATA.devices.find((d) => d.id === id).name;

function reportLink(device, cve, verdict) {
  const body = [`**Router:** ${device.name}`, `**Versions:** ${device.old} to ${device.new}`, `**CVE:** ${cve}`, `**Current verdict:** ${verdict}`, "", "**What is wrong:**", "", "**Evidence (code, commit or test):**", ""].join("\n");
  const url = `${REPOSITORY}/issues/new?title=${encodeURIComponent(`Wrong verdict: ${cve} on ${device.name}`)}&body=${encodeURIComponent(body)}`;
  return `<a class="report" href="${esc(url)}" target="_blank" rel="noopener">Report a mistake</a>`;
}

/* Issues reviewed as likely present, kernel and programs together, with the reason for each version. */
function likelyIssues(device) {
  const reason = (row, release) => row.verdicts.find((v) => v.release === release && v.open)?.reason || null;
  const kernel = device.likely.map((row) => ({ cve: row.cve, score: row.score, where: "Kernel", before: reason(row, device.old), after: reason(row, device.new) }));
  const programs = device.components.filter((row) => row.states[device.old]?.open || row.states[device.new]?.open).map((row) => ({
    cve: row.cve, score: row.score, where: row.component,
    before: row.states[device.old]?.open ? row.states[device.old].reason : null,
    after: row.states[device.new]?.open ? row.states[device.new].reason : null,
  }));
  return [...kernel, ...programs].sort((a, b) => (b.score || 0) - (a.score || 0));
}

function severity(value) {
  if (value == null) return { key: "", label: "No score" };
  if (value >= 9) return { key: "critical", label: "Critical" };
  if (value >= 7) return { key: "high", label: "High" };
  if (value >= 4) return { key: "medium", label: "Medium" };
  return { key: "", label: "Low" };
}

function outcome(issues) {
  const gone = issues.filter((i) => i.before && !i.after);
  const added = issues.filter((i) => i.after && !i.before);
  const kept = issues.filter((i) => i.before && i.after);
  const headline = gone.length > added.length ? "Updating looks worthwhile"
    : gone.length < added.length ? "Updating adds more issues than it removes"
    : "Updating does not clearly change the picture";
  return { gone, added, kept, headline };
}

function plainAnswer(device, issues) {
  const { gone, added, kept, headline } = outcome(issues);
  const word = (count) => `${number.format(count)} ${count === 1 ? "issue" : "issues"}`;
  const worst = added[0] ? ` The most severe new one is ${cveLink(added[0].cve)}, with a CVSS of ${score(added[0].score)}.` : "";
  const manager = device.image.facts.find((f) => f.label === "Package manager");
  const moved = manager.old !== manager.new ? `<p>The package manager also changes from <code>${esc(manager.old)}</code> to <code>${esc(manager.new)}</code>, so your own scripts may need updating.</p>` : "";
  return `<section class="verdict" aria-label="In short">
      <div class="verdict-text">
        <div class="kicker">Based on issues reviewed by hand</div>
        <h2>${headline}</h2>
        <p>Updating from ${esc(device.old)} to ${esc(device.new)} removes ${word(gone.length)} we consider likely present and adds ${word(added.length)}.${worst}</p>
        ${moved}
      </div>
      <dl class="tiles" aria-label="Likely issues after updating">
        <div class="tile good"><dt>Removed</dt><dd>−${number.format(gone.length)}</dd></div>
        <div class="tile bad"><dt>New</dt><dd>+${number.format(added.length)}</dd></div>
        <div class="tile"><dt>Stay</dt><dd>${number.format(kept.length)}</dd></div>
      </dl>
      <p class="note">This does not prove the update is safe. It covers only issues reviewed by hand, and it cannot see problems nobody has reported.</p>
    </section>`;
}

/* CVEs with the same reason, such as the four awk ones, read better as one entry. */
function issueCards(device, rows, field, change) {
  const groups = new Map();
  rows.forEach((issue) => {
    const key = `${issue.where}|${change(issue)}|${issue[field]}`;
    if (!groups.has(key)) groups.set(key, { where: issue.where, change: change(issue), reason: issue[field], score: issue.score, cves: [] });
    groups.get(key).cves.push(issue.cve);
  });
  return `<div class="issues">${[...groups.values()].map((group) => {
    const level = severity(group.score);
    const release = field === "after" ? device.new : device.old;
    return `<article class="issue">
      <div class="score ${level.key}" title="CVSS ${score(group.score)}"><b>${score(group.score)}</b><span>${level.label}</span></div>
      <div class="issue-body">
        <div class="issue-head"><span class="pill ${group.change}">${CHANGES[group.change]}</span><span class="ref">${esc(group.where)}</span></div>
        <h4>${group.cves.map(cveLink).join(", ")}</h4>
        <p class="note">${esc(group.reason)}</p>
        ${reportLink(device, group.cves.join(", "), `Likely present (${release})`)}
      </div>
    </article>`;
  }).join("")}</div>`;
}

function lookFirst(device, issues) {
  const after = issues.filter((i) => i.after);
  const gone = issues.filter((i) => i.before && !i.after);
  const afterCards = after.length ? issueCards(device, after, "after", (i) => (i.before ? "stayed" : "entered")) : '<p class="note">None.</p>';
  const goneCards = gone.length ? `<details class="more"><summary>${number.format(gone.length)} likely ${gone.length === 1 ? "issue goes" : "issues go"} away after updating</summary>${issueCards(device, gone, "before", () => "left")}</details>` : "";
  return `<section>
      <h2>Look at these first</h2>
      <p>Reviewed by hand and likely present after updating to ${esc(device.new)}. A high CVSS alone does not put a CVE here.</p>
      ${afterCards}
      ${goneCards}
    </section>`;
}

function stackedBars(rows, segments, maximum, unit) {
  const bars = rows.map((row) => `<div class="bar-row"><div class="bar-label">${esc(row.label)}</div>
    <div class="bar" style="width:${(row.total / maximum) * 100}%" role="img" aria-label="${esc(row.label)}: ${segments.map(([key, name]) => `${name} ${unit(row.values[key])}`).join(", ")}">
    ${segments.filter(([key]) => row.values[key] > 0).map(([key, name]) => `<div class="seg" data-tip="${esc(row.label)}. ${esc(name)}: ${esc(unit(row.values[key]))}" style="flex:${row.values[key]} 0 0;background:var(--c-${key})"></div>`).join("")}
    </div></div>`).join("");
  const legend = segments.map(([key, name]) => `<span><i style="background:var(--c-${key})"></i>${esc(name)}</span>`).join("");
  return `<div class="bars">${bars}</div><div class="legend">${legend}</div>`;
}

function home() {
  const cards = DATA.devices.map((d) => {
    const [before, after] = d.splits;
    const { gone, added, kept, headline } = outcome(likelyIssues(d));
    return `<a class="chip" href="#${esc(d.id)}">
      <div class="ref">${esc(d.target)} · OpenWrt ${esc(d.old)} → ${esc(d.new)}</div>
      <h3>${esc(d.name)}</h3>
      <div class="chip-verdict">${headline}</div>
      <div class="chip-tiles"><span class="pill left">${number.format(gone.length)} removed</span><span class="pill entered">${number.format(added.length)} new</span><span class="pill stayed">${number.format(kept.length)} stay</span></div>
      <div class="chip-foot"><span><b>${number.format(before.open)} → ${number.format(after.open)}</b> open kernel CVEs</span><span class="chip-open">Open sheet</span></div>
    </a>`;
  }).join("");
  const rows = DATA.differences.map((row) => `<tr>
      <td class="id">${cveLink(row.cve)}<div class="ref">CVSS ${score(row.score)} · ${esc(row.release)}</div></td>
      ${row.verdicts.map((v) => `<td>${pill(v.status)}<details class="why"><summary>Why</summary><p>${esc(v.reason)}</p></details></td>`).join("")}
    </tr>`).join("");
  const names = DATA.differences[0]?.verdicts.map((v) => `<th>${esc(deviceName(v.device))}</th>`).join("") || "";
  return `<section class="hero">
      <div class="intro">
        <h1>What changes on your router when you update the firmware?</h1>
        <p class="lead">Generic CVE lists rarely say whether a flaw applies to your device. Here, each router gets its own answer.</p>
      </div>
      <ol class="steps" aria-label="How it works">
        <li><b>Official images</b><span>Downloaded from OpenWrt and verified by hash.</span></li>
        <li><b>Compiled code</b><span>Each CVE is checked against what was built for that router.</span></li>
        <li><b>Hand review</b><span>Every open CVE with a CVSS of 8.0 or higher is read in the code.</span></li>
      </ol>
    </section>
    <section aria-label="Routers analyzed"><div class="chips">${cards}</div></section>
    <section>
      <h2>Same software, different answers</h2>
      <p>These routers run the same kernel versions, but the hardware changes the answer. The number of CPUs or a network driver can make a flaw possible or impossible.</p>
      <div class="table-box"><table class="stack"><caption>Verdicts that depend on the router</caption>
        <thead><tr><th>CVE</th>${names}</tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    <section>
      <h2>How to read the statuses</h2>
      <dl class="glossary">
        <div><dt>${pill("Likely present")}</dt><dd>Reviewed by hand. The fix is missing and the code can be reached. Not tested on a device.</dd></div>
        <div><dt>${pill("To confirm")}</dt><dd>The code is compiled and the fix was not demonstrated. Nobody reviewed it by hand.</dd></div>
        <div><dt>${pill("Unused code")}</dt><dd>The code exists, but the image configuration does not reach it. It counts again if the feature is enabled.</dd></div>
        <div><dt>${pill("Present, no impact")}</dt><dd>The code is there, but the flaw has no effect on this router.</dd></div>
        <div><dt>${pill("Not applicable")}</dt><dd>The flaw requires something this router does not have.</dd></div>
        <div><dt>${pill("To review")}</dt><dd>There is not enough data to decide. It is not counted as open.</dd></div>
      </dl>
    </section>`;
}

function cveTable(device) {
  const filter = { change: "all", severe: false, query: "" };
  const controls = [["all", `All (${number.format(device.cves.length)})`], ["left", `Gone (${number.format(device.counts.left)})`], ["entered", `New (${number.format(device.counts.entered)})`], ["stayed", `Still open (${number.format(device.counts.stayed)})`]];
  const markup = `<div class="controls">
      ${controls.map(([value, label]) => `<button type="button" data-change="${value}" aria-pressed="${value === "all"}">${label}</button>`).join("")}
      <label><input type="checkbox" id="severe"> CVSS 7 or higher only</label>
      <input type="search" id="query" placeholder="Search CVE or topic" aria-label="Search CVE or topic">
    </div>
    <p class="note" id="shown" aria-live="polite"></p>
    <div class="table-box tall"><table><caption>Kernel CVEs open in at least one version</caption>
      <thead><tr><th>CVE</th><th class="num">CVSS</th><th>Change</th><th>${esc(device.old)}</th><th>${esc(device.new)}</th><th>Topic</th></tr></thead>
      <tbody id="cve-rows"></tbody></table></div>`;
  const render = () => {
    const query = filter.query.toLowerCase();
    const rows = device.cves.filter((r) => (filter.change === "all" || r.change === filter.change)
      && (!filter.severe || (r.score || 0) >= 7)
      && (!query || `${r.cve} ${r.title}`.toLowerCase().includes(query)));
    document.getElementById("cve-rows").innerHTML = rows.map((r) => `<tr>
      <td class="id">${cveLink(r.cve)}</td><td class="num">${score(r.score)}</td>
      <td><span class="pill ${r.change}">${CHANGES[r.change]}</span></td>
      <td>${pill(r.old)}</td><td>${pill(r.new)}</td><td class="wide">${esc(r.title)}</td></tr>`).join("");
    document.getElementById("shown").textContent = rows.length ? `${number.format(rows.length)} CVEs in this view.` : "No CVE matches these filters. Clear the search or choose All.";
  };
  const bind = () => {
    document.querySelectorAll("[data-change]").forEach((button) => button.addEventListener("click", () => {
      filter.change = button.dataset.change;
      document.querySelectorAll("[data-change]").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      render();
    }));
    document.getElementById("severe").addEventListener("change", (event) => { filter.severe = event.target.checked; render(); });
    document.getElementById("query").addEventListener("input", (event) => { filter.query = event.target.value.trim(); render(); });
    render();
  };
  return { markup, bind };
}

const TABS = [["overview", "Overview"], ["cves", "Kernel CVEs"], ["review", "Manual review"], ["programs", "Programs"], ["image", "Image changes"], ["method", "How it was verified"]];
let activeTab = "overview";

function selectTab(key, focus) {
  activeTab = key;
  TABS.forEach(([name]) => {
    const selected = name === key;
    const button = document.getElementById(`tab-${name}`);
    button.setAttribute("aria-selected", String(selected));
    button.tabIndex = selected ? 0 : -1;
    document.getElementById(`panel-${name}`).hidden = !selected;
    if (selected && focus) button.focus();
  });
  document.getElementById(`tab-${key}`).scrollIntoView({ block: "nearest", inline: "nearest" });
}

function bindTabs() {
  document.querySelectorAll("[data-tab]").forEach((button) => {
    button.addEventListener("click", () => selectTab(button.dataset.tab, false));
    button.addEventListener("keydown", (event) => {
      const names = TABS.map(([name]) => name);
      const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
      if (step) {
        event.preventDefault();
        selectTab(names[(names.indexOf(button.dataset.tab) + step + names.length) % names.length], true);
      }
    });
  });
  document.querySelectorAll("[data-go]").forEach((button) => button.addEventListener("click", () => selectTab(button.dataset.go, false)));
}

function sheet(device) {
  const [before, after] = device.splits;
  const image = device.image;
  const check = device.verification;
  const maximum = Math.max(before.total, after.total);
  const bars = stackedBars(device.splits.map((s) => ({
    label: s.release, total: s.total,
    values: { outside: s.outside + s.reviewed_out, fixed: s.fixed, review: s.review, open: s.open },
  })), SEGMENTS, maximum, (v) => number.format(v));
  const splitRows = [["Initial candidates", "total"], ["Fixed, or never present", "fixed"], ["Outside this router", "outside"], ["To review", "review"], ["Removed by manual review", "reviewed_out"], ["Open", "open"]]
    .map(([label, key]) => `<tr><td>${label}</td><td class="num">${number.format(before[key])}</td><td class="num">${number.format(after[key])}</td></tr>`).join("");
  const mapRows = image.map.map((m) => ({ label: m.release, total: m.bytes, values: { outside: m.kernel, fixed: m.rootfs } }));
  const mapBars = stackedBars(mapRows, [["outside", "Kernel"], ["fixed", "File system"]], Math.max(...image.map.map((m) => m.bytes)), megabytes);
  const table = cveTable(device);
  const issues = likelyIssues(device);
  const direction = after.open < before.open ? "The new version has fewer open candidates." : after.open > before.open ? "The new version has more open candidates." : "Both versions have the same number of open candidates.";
  const facts = image.facts.map((f) => `<tr><td>${esc(f.label)}</td><td class="mono">${esc(f.old)}</td><td class="mono">${esc(f.new)}</td></tr>`).join("");
  const packages = image.key_packages.map((p) => `<tr><td class="mono">${esc(p.name)}</td><td class="mono">${esc(p.old)}</td><td class="mono">${esc(p.new)}</td></tr>`).join("");
  const reviewed = device.reviewed.map((r) => `<tr><td class="id">${cveLink(r.cve)}</td><td class="num">${score(r.score)}</td>
    <td class="wide">${r.verdicts.map((v) => `<div>${pill(v.status)} <span class="ref">${esc(v.release)}</span></div><div class="note">${esc(v.reason)}</div>`).join("")}${reportLink(device, r.cve, r.verdicts.map((v) => `${v.status} (${v.release})`).join(", "))}</td></tr>`).join("");
  const components = device.components.map((r) => {
    const cell = (release) => (r.states[release] ? pill(r.states[release].label) : '<span class="ref">Not listed</span>');
    const reason = (r.states[device.new] || r.states[device.old]).reason;
    return `<tr><td class="id">${cveLink(r.cve)}</td><td class="mono">${esc(r.component)}</td><td class="num">${score(r.score)}</td><td>${cell(device.old)}</td><td>${cell(device.new)}</td><td class="wide note">${esc(reason)}</td></tr>`;
  }).join("");
  const list = (items) => (items.length ? `<ul class="tags">${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : '<p class="note">None.</p>');
  const configs = image.configs.map((c) => (c.diff ? `<details><summary>${esc(c.path)}</summary><pre>${esc(c.diff)}</pre></details>` : `<p class="note"><code>${esc(c.path)}</code>: no changes.</p>`)).join("");
  const provenance = check.provenance.map((p) => `<tr><td class="mono">${esc(p.release)}</td><td class="mono">${esc(p.image)}</td><td class="mono">${esc(p.sha256)}</td></tr>`).join("");
  const shifted = check.shift.some(Boolean)
    ? ` The kernel version text appears ${check.shift[0]} and ${check.shift[1]} bytes before the expected address. This offset is not explained, so this evidence is weaker than an exact address.` : "";
  const checks = [
    `Kernel: ${check.kernel_confirmed ? "the image kernel data is at the address given by the official debug symbols." : "not confirmed against the official debug symbols."}${shifted}`,
    `"Fixed" verdicts on compiled code: ${number.format(check.fixed_total)} in total, ${number.format(check.fixed_by_tool)} confirmed in the real code by the tool and ${number.format(check.fixed_by_hand.length)} by hand. To confirm: ${number.format(check.fixed_unresolved.length)}.`,
    `"Not compiled" code: ${number.format(check.rules_disabled)} of ${number.format(check.rules_checked)} direct Makefile rules have the option off in the real <code>.config</code>.${check.rule_exceptions.length ? ` Exceptions: ${check.rule_exceptions.map((p) => `<code>${esc(p)}</code>`).join(", ")}.` : ""}`,
    `Function filter: ${number.format(check.functions_proved)} of ${number.format(check.functions_retired)} removals have evidence independent of the method that removed them.`,
    `Controls: ${check.controls_ok ? "all landed in the expected category." : "at least one failed."}`,
  ].map((text) => `<li>${text}</li>`).join("");
  const panels = {
    overview: `${plainAnswer(device, issues)}
      ${lookFirst(device, issues)}
      <div class="jump">
        <div class="big">${number.format(before.open)} <span>→</span> ${number.format(after.open)}</div>
        <p class="note">Open kernel CVEs that follow the automatic classification or were reviewed as likely present.</p>
        <button type="button" class="link-button" data-go="cves">See all kernel CVEs</button>
      </div>`,
    cves: `<section>
        <h2>Open kernel CVEs</h2>
        <div class="answer">
          <div class="big">${number.format(before.open)} <span>→</span> ${number.format(after.open)}</div>
          <div class="intro">
            <p>${direction} This is a signal, not a measure of risk: the count also depends on what was recorded for each kernel series.</p>
            <div class="tally"><span><b>${number.format(device.counts.left)}</b>gone</span><span><b>${number.format(device.counts.entered)}</b>new</span><span><b>${number.format(device.counts.stayed)}</b>still open</span></div>
          </div>
        </div>
        <p class="note">Open means the code is compiled and the fix was not demonstrated. It does not prove that the flaw is exploitable on this router.</p>
      </section>
      <section>
        <h2>Where the candidates went</h2>
        ${bars}
        <details><summary>Numbers by stage</summary><div class="table-box"><table><caption>Kernel candidates by stage</caption>
          <thead><tr><th>Stage</th><th class="num">${esc(device.old)}</th><th class="num">${esc(device.new)}</th></tr></thead><tbody>${splitRows}</tbody></table></div></details>
      </section>
      <section>
        <h2>All open kernel CVEs</h2>
        ${table.markup}
      </section>`,
    review: `<section>
        <h2>Manual review</h2>
        <p>Every CVE with a CVSS of 8.0 or higher was read in the code of this router. CVSS is a generic score, and this verdict is what counts here.</p>
        <div class="table-box"><table class="stack"><caption>Manual verdicts</caption>
          <thead><tr><th>CVE</th><th class="num">CVSS</th><th>Verdict and reason</th></tr></thead><tbody>${reviewed}</tbody></table></div>
      </section>`,
    programs: `<section>
        <h2>Programs outside the kernel</h2>
        <div class="table-box"><table><caption>Program CVEs</caption>
          <thead><tr><th>CVE</th><th>Program</th><th class="num">CVSS</th><th>${esc(device.old)}</th><th>${esc(device.new)}</th><th>Reason</th></tr></thead><tbody>${components}</tbody></table></div>
      </section>`,
    image: `<section>
        <h2>Image map</h2>
        ${mapBars}
        <p class="note">${image.map.map((m) => `${esc(m.release)}: file system from <code>${hex(m.kernel)}</code>, ${megabytes(m.bytes)} in total.`).join(" ")}</p>
      </section>
      <section>
        <h2>Measures and packages</h2>
        <div class="columns">
          <div class="table-box"><table><caption>Image measures</caption><thead><tr><th>Measure</th><th>${esc(device.old)}</th><th>${esc(device.new)}</th></tr></thead><tbody>${facts}</tbody></table></div>
          <div class="table-box"><table><caption>Main packages</caption><thead><tr><th>Package</th><th>${esc(device.old)}</th><th>${esc(device.new)}</th></tr></thead><tbody>${packages}</tbody></table></div>
        </div>
        <p>${number.format(image.packages_added.length)} packages added, ${number.format(image.packages_removed.length)} removed and ${number.format(image.packages_changed)} with a changed version.</p>
        <div class="columns">
          <div><h3>Packages added</h3>${list(image.packages_added)}</div>
          <div><h3>Packages removed</h3>${list(image.packages_removed)}</div>
          <div><h3>Programs added</h3>${list(image.programs_added)}</div>
          <div><h3>Programs removed</h3>${list(image.programs_removed)}</div>
        </div>
      </section>
      <section>
        <h2>Default settings</h2>
        ${configs}
      </section>`,
    method: `<section>
        <h2>How this was verified</h2>
        <ul class="plain">${checks}</ul>
        <p>Found a mistake? <a href="${REPOSITORY}/issues/new" target="_blank" rel="noopener">Open an issue on GitHub</a> with the evidence, or see the <a href="${REPOSITORY}" target="_blank" rel="noopener">code and full reports</a>.</p>
      </section>
      <section>
        <h2>Limits</h2>
        <ul class="plain">
          <li>All of this is static analysis. Nothing was tested on a device.</li>
          <li>The analysis covers the configuration shipped in the image, not an already configured router.</li>
          <li>Installing packages or enabling features can make a CVE marked as outside this router relevant.</li>
          <li>CVEs below CVSS 8.0 follow the automatic classification.</li>
          <li>The kernel was read without the OpenWrt patches, except in manual reviews that mention them.</li>
          <li>hostapd and wpad were not correlated, because they use dated snapshots.</li>
        </ul>
      </section>
      <section>
        <h2>Images analyzed</h2>
        <div class="table-box"><table><caption>Provenance</caption><thead><tr><th>Version</th><th>Official image</th><th>SHA-256</th></tr></thead><tbody>${provenance}</tbody></table></div>
      </section>`,
  };
  app.innerHTML = `<section class="sheet-head">
      <div class="ref">${esc(device.id)}</div>
      <h1>${esc(device.name)}</h1>
      <dl class="spec">
        <div><dt>Versions</dt><dd>${esc(device.old)} → ${esc(device.new)}</dd></div>
        <div><dt>OpenWrt target</dt><dd>${esc(device.target)}</dd></div>
        <div><dt>Kernel</dt><dd>${esc(device.kernels[0])} → ${esc(device.kernels[1])}</dd></div>
        <div><dt>CVEs consulted</dt><dd>${esc(check.consulted)}</dd></div>
      </dl>
    </section>
    <div class="sheet">
      <div class="tabs" role="tablist" aria-label="Sheet sections">
        ${TABS.map(([key, label]) => `<button type="button" role="tab" id="tab-${key}" aria-controls="panel-${key}" aria-selected="${key === activeTab}" tabindex="${key === activeTab ? 0 : -1}" data-tab="${key}">${label}</button>`).join("")}
      </div>
      ${TABS.map(([key]) => `<div class="panel" role="tabpanel" id="panel-${key}" aria-labelledby="tab-${key}" tabindex="0"${key === activeTab ? "" : " hidden"}>${panels[key]}</div>`).join("")}
    </div>`;
  bindTabs();
  table.bind();
}

function route() {
  const id = location.hash.slice(1);
  const device = DATA.devices.find((d) => d.id === id);
  document.getElementById("nav").innerHTML = DATA.devices.map((d) => `<a href="#${esc(d.id)}"${d === device ? ' aria-current="page"' : ""}>${esc(d.name)}</a>`).join("")
    + `<a href="${REPOSITORY}" target="_blank" rel="noopener">GitHub</a>`;
  if (device) sheet(device); else app.innerHTML = home();
  window.scrollTo(0, 0);
}

document.addEventListener("pointermove", (event) => {

    tip.style.left = `${Math.min(event.clientX + 12, innerWidth - 250)}px`;

});

document.getElementById("foot").innerHTML = `<div class="foot-links">

addEventListener("hashchange", route);
route();
